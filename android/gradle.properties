org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# Run the Kotlin compiler in-process to avoid flaky compile-daemon startup
# failures ("Could not connect to Kotlin compile daemon") on some machines.
kotlin.compiler.execution.strategy=in-process
# Faster, more reliable local builds.
org.gradle.parallel=true
org.gradle.caching=true
