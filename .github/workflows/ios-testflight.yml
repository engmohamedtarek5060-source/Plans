name: iOS TestFlight

# Manual trigger only. Run it from the GitHub UI:
#   Actions -> "iOS TestFlight" -> "Run workflow"
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (must be higher than the last one uploaded for this version). Leave blank to use the workflow run number."
        required: false
        type: string
      release_notes:
        description: "What to Test notes shown to TestFlight testers."
        required: false
        default: "Internal build."
        type: string

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      # Must match PRODUCT_BUNDLE_IDENTIFIER in ios/Runner.xcodeproj/project.pbxproj
      BUNDLE_ID: com.plans.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolves whatever stable Xcode the runner image ships, rather than pinning a
      # path like /Applications/Xcode_16.2.app that breaks when the image is updated.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - name: Resolve build number
        id: buildnum
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            echo "value=${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # The .p8 App Store Connect key. altool and xcodebuild both look for it in
      # ~/private_keys/AuthKey_<KEY_ID>.p8, so it is written there rather than passed inline.
      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Compiles Dart to a release AOT bundle and runs `pod install`, without touching signing.
      # Signing is handled by the archive step so provisioning failures surface with clear errors.
      - name: Build Flutter iOS bundle
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ steps.buildnum.outputs.value }}

      - name: Inject Team ID into ExportOptions
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed "s/__TEAM_ID__/${APPLE_TEAM_ID}/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      # -allowProvisioningUpdates lets Xcode create the distribution certificate and
      # provisioning profile on demand using the API key, so no .p12 or .mobileprovision
      # has to be generated by hand on a Mac.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Validate IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # Kept so a failed upload can be retried from the artifact without a rebuild.
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build-${{ steps.buildnum.outputs.value }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: success()
        run: |
          echo "### Uploaded to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle ID: \`$BUNDLE_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build number: ${{ steps.buildnum.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Notes: ${{ inputs.release_notes }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Processing takes 5-15 minutes before the build appears in TestFlight." >> "$GITHUB_STEP_SUMMARY"
